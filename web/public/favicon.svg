<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <!-- 信号绿渐变 -->
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ff0a8"/>
      <stop offset="100%" stop-color="#3cc474"/>
    </linearGradient>
    <!-- 暖琥珀渐变 -->
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a25a"/>
      <stop offset="100%" stop-color="#c07530"/>
    </linearGradient>
    <!-- 外层波纹渐变透明 -->
    <linearGradient id="waveOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4dd88d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4dd88d" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角背景 -->
  <rect width="48" height="48" rx="10" fill="#0e1219"/>
  <rect width="48" height="48" rx="10" fill="url(#greenGrad)" opacity="0.04"/>

  <!-- 最外层波纹（右上） -->
  <path d="M22.5 10 A14.8 14.8 0 0 1 37 24" fill="none" stroke="url(#waveOuter)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 中层波纹（右上） -->
  <path d="M22.5 14 A10.6 10.6 0 0 1 33 24" fill="none" stroke="#4dd88d" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>

  <!-- 内层波纹（右上） -->
  <path d="M22.5 17.5 A7 7 0 0 1 29.5 24" fill="none" stroke="#4dd88d" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>

  <!-- 最外层波纹（左下） -->
  <path d="M25.5 38 A14.8 14.8 0 0 1 11 24" fill="none" stroke="url(#waveOuter)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 中层波纹（左下） -->
  <path d="M25.5 34 A10.6 10.6 0 0 1 15 24" fill="none" stroke="#4dd88d" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>

  <!-- 内层波纹（左下） -->
  <path d="M25.5 30.5 A7 7 0 0 1 18.5 24" fill="none" stroke="#4dd88d" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>

  <!-- 中心信号点 — 双色叠加：绿 + 暖琥珀 -->
  <circle cx="24" cy="24" r="4" fill="url(#greenGrad)"/>
  <circle cx="24" cy="24" r="4" fill="url(#amberGrad)" opacity="0.35"/>

  <!-- 中心亮点 -->
  <circle cx="23" cy="23" r="1.4" fill="#b8f5d4" opacity="0.7"/>
</svg>